spring:
  application:
    name: order-flow
  datasource:
      url: ${DB_URL:jdbc:mysql://localhost:3306/order_flow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      username: ${DB_USERNAME:orderflow}
      password: ${DB_PASSWORD:orderflow_dev}
      hikari:
          maximum-pool-size: 10
          minimum-idle: 2
          connection-timeout: 3000
  flyway:
      enabled: true
      locations: classpath:db/migration
server:
    port: ${SERVER_PORT:8080}
    shutdown: graceful
management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics
logging:
    level:
        com.example.orderflow: INFO
